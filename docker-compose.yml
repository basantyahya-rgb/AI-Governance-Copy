services:
  ollama:
    image: ollama/ollama
    container_name: ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  ai-governance:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-governance

    depends_on:
      ollama:
        condition: service_healthy

    ports:
      - "8000:8000"

    environment:
      OLLAMA_HOST: http://ollama:11434
      QWEN_MODEL: qwen3:8b

    env_file:
      - backend/.env

    restart: unless-stopped

volumes:
  ollama_data: